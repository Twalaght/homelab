---
log:
    level: ERROR
global:
    checkNewVersion: true
    sendAnonymousUsage: false
api:
    dashboard: true
    insecure: false
entrypoints:
    web:
        address: :80
        http:
            redirections:
                entryPoint:
                    to: websecure
                    scheme: https
    websecure:
        address: :443
        # Accept proxy protocol from clients (e.g., from a CDN or load balancer)
        proxyProtocol:
            insecure: true
        forwardedHeaders:
            # Trust these IP ranges for reading X-Forwarded-* headers
            trustedIPs:
            -   10.0.0.0/8
            -   172.20.0.0/16
            -   192.168.0.0/16
            -   127.0.0.1/32
    private:
        address: :621
    public:
        address: :666
certificatesResolvers:
    staging-letsencrypt:
        acme:
            email: ''
            storage: /ssl-certs/acme.json
            caServer: https://acme-staging-v02.api.letsencrypt.org/directory
            httpChallenge:
                entrypoint: web
    prod-letsencrypt:
        acme:
            email: ''
            storage: /ssl-certs/acme.json
            caServer: https://acme-v02.api.letsencrypt.org/directory
            httpChallenge:
                entrypoint: web
    staging-letsencrypt-dns:
        acme:
            email: ''
            storage: /ssl-certs/acme-dns.json
            caServer: https://acme-staging-v02.api.letsencrypt.org/directory
            dnsChallenge:
                provider: cloudflare
                resolvers:
                -   1.1.1.1:53
    prod-letsencrypt-dns:
        acme:
            email: ''
            storage: /ssl-certs/prod-acme-dns.json
            caServer: https://acme-v02.api.letsencrypt.org/directory
            dnsChallenge:
                provider: cloudflare
                resolvers:
                -   1.1.1.1:53
serversTransport:
    insecureSkipVerify: true
providers:
    docker:
        exposedByDefault: false
    file:
        directory: /etc/traefik/dynamic
        watch: true
