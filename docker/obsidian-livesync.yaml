---
services:
    obsidian_couchdb:
        image: couchdb
        container_name: obsidian_livesync
        restart: unless-stopped
        user: 1000:1000
        environment:
        -   COUCHDB_USER=${COUCHDB_USERNAME}
        -   COUCHDB_PASSWORD=${COUCHDB_PASSWORD}
        volumes:
        -   ${SERVER_DATA_PATH}/obsidian:/opt/couchdb/data
        -   ${SERVER_CONFIG_PATH}/obsidian/local.ini:/opt/couchdb/etc/local.ini
        labels:
        -   traefik.enable=true
        -   traefik.http.routers.obsidian_livesync.entrypoints=public
        -   traefik.http.routers.obsidian_livesync.rule=Host(`obsidian.${DOMAIN_NAME}`)
        -   traefik.http.services.obsidian_livesync.loadbalancer.server.port=5984
networks:
    default:
        name: ${OVERLAY_NETWORK}
        external: true
