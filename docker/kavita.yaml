---
services:
    kavita:
        image: linuxserver/kavita
        container_name: kavita
        restart: unless-stopped
        environment:
        -   PUID=1000
        -   PGID=1000
        -   TZ=${SERVER_TIME_ZONE}
        volumes:
        -   ${SERVER_CONFIG_PATH}/kavita:/config
        -   ${SERVER_DATA_PATH}/kavita:/data
        labels:
        -   traefik.enable=true
        -   traefik.http.routers.kavita.entrypoints=private
        -   traefik.http.routers.kavita.rule=Host(`kavita.${DOMAIN_NAME}`)
        -   traefik.http.services.kavita.loadbalancer.server.port=5000
networks:
    default:
        name: ${OVERLAY_NETWORK}
        external: true
