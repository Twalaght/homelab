---
services:
    bind9:
        container_name: bind9
        image: ubuntu/bind9
        restart: unless-stopped
        ports:
        -   53:53/tcp
        -   53:53/udp
        networks:
            default:
                ipv4_address: ${DOCKER_DNS_SERVER_PRIMARY}
        environment:
        -   BIND9_USER=root
        -   TZ=${SERVER_TIME_ZONE}
        volumes:
        -   ${SERVER_CONFIG_PATH}/bind9/config:/etc/bind
        -   ${SERVER_CONFIG_PATH}/bind9/records:/var/lib/bind
        -   ${SERVER_CACHE_PATH}/bind9/cache:/var/cache/bind
networks:
    default:
        name: ${OVERLAY_NETWORK}
        external: true
