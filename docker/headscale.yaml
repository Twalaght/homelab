---
services:
    headscale:
        image: headscale/headscale:v0.25.1
        container_name: headscale
        restart: unless-stopped
        command: serve
        volumes:
        -   ${SERVER_CONFIG_PATH}/headscale:/etc/headscale
        -   ${SERVER_DATA_PATH}/headscale:/var/lib/headscale
        labels:
        -   traefik.enable=true
        -   traefik.http.routers.headscale.tls=true
        -   traefik.http.routers.headscale.tls.certresolver=${CERT_RES_DNS}
        -   traefik.http.routers.headscale.entrypoints=${HTTPS_ENTRY}
        -   traefik.http.routers.headscale.rule=Host(`headscale.${DOMAIN_NAME}`)
        -   traefik.http.services.headscale.loadbalancer.server.port=8080
    headplane:
        image: ghcr.io/tale/headplane:0.5.10
        container_name: headplane
        restart: unless-stopped
        volumes:
        -   ${SERVER_CONFIG_PATH}/headscale/config.yaml:/etc/headscale/config.yaml
        -   ${SERVER_CONFIG_PATH}/headplane/config.yaml:/etc/headplane/config.yaml
        -   ${SERVER_DATA_PATH}/headplane:/var/lib/headplane
        -   /var/run/docker.sock:/var/run/docker.sock:ro
        labels:
        -   traefik.enable=true
        -   traefik.http.routers.headplane.tls=true
        -   traefik.http.routers.headplane.tls.certresolver=${CERT_RES_DNS}
        -   traefik.http.routers.headplane.entrypoints=${HTTPS_ENTRY}
        -   traefik.http.routers.headplane.rule=Host(`headplane.${DOMAIN_NAME}`) && ${TRUSTED_CLIENT_IPS}
        -   traefik.http.services.headplane.loadbalancer.server.port=3000
    tailscale:
        image: tailscale/tailscale
        container_name: tailscale
        restart: unless-stopped
        hostname: headtailscale
        dns: ${DNS_SERVER_PRIMARY}
        cap_add:
        -   NET_ADMIN
        -   NET_RAW
        volumes:
        -   ${SERVER_DATA_PATH}/tailscale:/var/lib/tailscale
        -   /dev/net/tun:/dev/net/tun
        environment:
        -   TS_STATE_DIR=/var/lib/tailscale
        -   TS_NO_LOGS_NO_SUPPORT=true
        -   TS_EXTRA_ARGS=--login-server=https://headscale.${DOMAIN_NAME} --advertise-exit-node --advertise-routes=${TAILSCALE_ROUTES}
            --accept-dns=true
        -   TS_AUTHKEY=${TAILSCALE_AUTHKEY}
networks:
    default:
        name: ${OVERLAY_NETWORK}
        external: true
