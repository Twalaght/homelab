---
services:
    unifi-network-application:
        image: lscr.io/linuxserver/unifi-network-application
        container_name: unifi-network-application
        restart: unless-stopped
        ports:
        -   8443:8443  # Web UI
        -   3478:3478/udp  # STUN
        -   10001:10001/udp  # AP discovery
        -   8080:8080  # Device communication
        -   1900:1900/udp  # Required for Make controller discoverable on L2 network option
        -   8843:8843  # Unifi guest portal HTTPS redirect port
        -   8880:8880  # Unifi guest portal HTTP redirect port
        -   6789:6789  # Mobile throughput test
        -   5514:5514/udp  # Remote syslog port
        environment:
        -   PUID=1000
        -   PGID=1000
        -   TZ=${SERVER_TIME_ZONE}
        -   MONGO_USER=unifi
        -   MONGO_PASS=${MONGO_SERVICE_PASSWORD}
        -   MONGO_HOST=unifi-db
        -   MONGO_PORT=27017
        -   MONGO_DBNAME=unifi
        -   MONGO_AUTHSOURCE=admin
        -   MEM_LIMIT=1024
        -   MEM_STARTUP=1024
        -   MONGO_TLS=  # Optional
        volumes:
        -   ${SERVER_CONFIG_PATH}/unifi:/config
        labels:
        -   traefik.enable=true
        -   traefik.http.routers.unifi.entrypoints=private
        -   traefik.http.routers.unifi.rule=Host(`unifi.${DOMAIN_NAME}`)
        -   traefik.http.services.unifi.loadbalancer.server.scheme=https
        -   traefik.http.services.unifi.loadbalancer.server.port=8443
    unifi-db:
        image: docker.io/mongo:8.0.9
        container_name: unifi-db
        restart: unless-stopped
        environment:
        -   MONGO_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
        -   MONGO_SERVICE_PASSWORD=${MONGO_SERVICE_PASSWORD}
        volumes:
        -   ${SERVER_DATA_PATH}/unifi:/data/db
        -   ${SERVER_CONFIG_PATH}/unifi/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
        -   ${SERVER_CACHE_PATH}/unifi:/data/configdb
networks:
    default:
        name: ${OVERLAY_NETWORK}
        external: true
